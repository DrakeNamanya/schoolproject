name: timbitwire_school
description: "Timbitwire Girls School management system - parents, staff and administration in one role-based app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & storage
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # Backend - Supabase (data + auth)
  supabase_flutter: ^2.8.0

  # Alerts - Firebase Cloud Messaging only
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3

  # UI / utils
  flutter_svg: 2.3.0
  intl: 0.20.2
  url_launcher: 6.3.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
