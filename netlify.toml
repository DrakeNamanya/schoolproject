# Netlify — Flutter web build of the Timbitwire admin console + parent/staff web preview.
# Set these in Netlify → Site settings → Environment variables (NOT in git):
#   SUPABASE_URL       = https://xmtikwmundczmhadhzcc.supabase.co
#   SUPABASE_ANON_KEY  = <anon JWT>
[build]
  command = "bash netlify/build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.35.4"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
